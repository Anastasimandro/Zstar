name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Each format feature builds on its own
        run: |
          for f in zip tar tar,gzip tar,zstd; do
            cargo clippy -p zstar-core --lib --locked --no-default-features --features "$f" -- -D warnings
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log || status=$?
          # Copy failures into annotations so they are readable without the raw log.
          if [ "${status:-0}" != 0 ]; then
            grep -E "^---- |panicked at|^error|assertion|left:|right:|FAILED" test.log | head -40 \
              | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit "${status:-0}"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
