name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cargo.lock cannot be generated by the developer sandbox (no access to
  # crates.io), so CI creates it when it is missing and exposes it as an
  # artifact. Download it from the run page and commit it to the repository.
  lockfile:
    name: Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Cargo.lock if missing
        id: gen
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo "Cargo.lock is committed, nothing to generate"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            cargo generate-lockfile
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated Cargo.lock
        if: steps.gen.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: error

  check:
    name: ${{ matrix.os }}
    needs: lockfile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Use the generated Cargo.lock
        if: hashFiles('Cargo.lock') == ''
        uses: actions/download-artifact@v8
        with:
          name: Cargo.lock
          path: .

      - name: Toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
