name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      # The fuzz crate has its own workspace, so `--all` above does not reach it.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The fuzz crate has its own workspace; its harness checks run on stable.
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - name: Each format feature builds on its own
        run: |
          for f in zip tar gzip zstd bzip2 xz lz4 brotli sevenz zip-bzip2 zip-lzma zip-zstd zip-deflate64 zip-aes sevenz-aes tar,gzip tar,zstd tar,bzip2 tar,xz tar,lz4; do
            cargo clippy -p zstar-core --lib --locked --no-default-features --features "$f" -- -D warnings
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused, see docs/adr/0004-macos-paused.md
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log || status=$?
          # Copy failures into annotations so they are readable without the raw log.
          if [ "${status:-0}" != 0 ]; then
            grep -E "^---- |panicked at|^error|assertion|left:|right:|FAILED" test.log | head -40 \
              | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit "${status:-0}"
      - name: Drive detection report (informational)
        shell: bash
        run: cargo run --locked -q -p zstar-cli -- drive-info .

  # The optional RAR reader is vendored C (libarchive) built by `cc`, so it is the one part of the
  # workspace that can fail to compile on a platform only. Every platform is built separately and
  # none blocks the others. macOS is paused for releases (ADR 0004) but is built here on purpose.
  # The build needs no fixtures; the fixture test (rar_fixtures) runs on the host builds.
  rar-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gnu, os: ubuntu-latest, target: "" }
          - { name: linux-musl, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: windows-msvc, os: windows-latest, target: "" }
          - { name: macos-arm64, os: macos-latest, target: "" }
          - { name: android-arm64, os: ubuntu-latest, target: aarch64-linux-android }
    name: rar-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rar-${{ matrix.name }}
      - name: musl toolchain
        if: matrix.name == 'linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Android NDK environment
        if: matrix.name == 'android-arm64'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Build zstar-rar
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked -p zstar-rar --target "${{ matrix.target }}"
          else
            cargo build --locked -p zstar-rar
          fi
      - name: Test the RAR crates and core with `rar` (host builds)
        if: matrix.target == ''
        run: |
          cargo test --locked -p zstar-rar-sys -p zstar-rar
          # Only the RAR paths: the rest of zstar-core's suite has timing and non-UTF-8 name tests
          # that are not run on macOS elsewhere in CI and are unrelated to RAR.
          cargo test --locked -p zstar-core --features rar --test rar_stubs
          cargo test --locked -p zstar-core --features rar --test rar_fixtures
          cargo test --locked -p zstar-core --features rar --lib -- rar detect
          cargo build --locked -p zstar-cli --features rar
      - name: Clippy with `rar`
        if: matrix.name == 'linux-gnu'
        run: |
          cargo clippy -p zstar-core --lib --locked --no-default-features --features rar -- -D warnings
          cargo clippy --workspace --all-targets --locked --features zstar-core/rar -- -D warnings

  # Release builds must not contain RAR until docs/reports/rar-provenance.md is signed off.
  rar-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: release.yml does not enable the rar feature
        run: |
          # Comment lines are ignored, so the explanation in release.yml cannot trip the check.
          if grep -v -E '^[[:space:]]*#' .github/workflows/release.yml | grep -n -E -- '--all-features|(--features|-F)[ =][^ ]*(rar|all)'; then
            echo "::error::release.yml enables the rar feature, but the provenance gate is not signed off"
            exit 1
          fi
      - name: rar is not a default feature
        run: |
          if grep -E '^default *=' crates/core/Cargo.toml crates/cli/Cargo.toml | grep -q '"rar"'; then
            echo "::error::rar must not be a default feature"
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # cargo-deny is built from crates.io at a pinned version with --locked (crates.io checks
      # the hash of every crate) and the binary is cached with the cargo registry, so the
      # download is rare. Only the install is retried; the check below never is.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-deny
          cache-bin: true
      - name: Install cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
        run: |
          if command -v cargo-deny >/dev/null && cargo deny --version | grep -qF "cargo-deny $CARGO_DENY_VERSION"; then
            echo "cargo-deny $CARGO_DENY_VERSION is cached"
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force; then
              exit 0
            fi
            echo "::warning::cargo-deny install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::cargo-deny could not be installed"
          exit 1
      - name: Check dependencies
        run: cargo deny --locked check
      # The fuzz workspace has its own lock file and its own config (it also allows NCSA, for
      # libfuzzer-sys). `!cancelled()` so a failure above does not hide this result.
      - name: Check fuzz dependencies
        if: ${{ !cancelled() }}
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

  # Pull requests only: 60 s per target, any crash, hang (10 s) or memory overrun (512 MiB)
  # fails the job. The long run is fuzz.yml. See docs/adr/0013-fuzzing.md.
  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [detect, zip_list_extract, tar_list_extract, sevenz_list_extract, rar_list_extract, single_stream, path_sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # libFuzzer needs the sanitizer flags of nightly; rust-src is for cargo-fuzz's -Zbuild-std.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          shared-key: fuzz
          cache-bin: true
      - name: Install cargo-fuzz
        shell: bash
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
        run: |
          if command -v cargo-fuzz >/dev/null && cargo fuzz --version | grep -qF "cargo-fuzz $CARGO_FUZZ_VERSION"; then
            echo "cargo-fuzz $CARGO_FUZZ_VERSION is cached"
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --force; then
              exit 0
            fi
            echo "::warning::cargo-fuzz install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::cargo-fuzz could not be installed"
          exit 1
      - name: Fuzz ${{ matrix.target }} for 60 s
        run: fuzz/run.sh ${{ matrix.target }} 60
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
