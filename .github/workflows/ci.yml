name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Each format feature builds on its own
        run: |
          for f in zip tar gzip zstd bzip2 xz lz4 brotli sevenz zip-bzip2 zip-lzma zip-zstd zip-deflate64 zip-aes sevenz-aes tar,gzip tar,zstd tar,bzip2 tar,xz tar,lz4; do
            cargo clippy -p zstar-core --lib --locked --no-default-features --features "$f" -- -D warnings
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused, see docs/adr/0004-macos-paused.md
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log || status=$?
          # Copy failures into annotations so they are readable without the raw log.
          if [ "${status:-0}" != 0 ]; then
            grep -E "^---- |panicked at|^error|assertion|left:|right:|FAILED" test.log | head -40 \
              | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit "${status:-0}"
      - name: Drive detection report (informational)
        shell: bash
        run: cargo run --locked -q -p zstar-cli -- drive-info .

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # cargo-deny is built from crates.io at a pinned version with --locked (crates.io checks
      # the hash of every crate) and the binary is cached with the cargo registry, so the
      # download is rare. Only the install is retried; the check below never is.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-deny
          cache-bin: true
      - name: Install cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
        run: |
          if command -v cargo-deny >/dev/null && cargo deny --version | grep -qF "cargo-deny $CARGO_DENY_VERSION"; then
            echo "cargo-deny $CARGO_DENY_VERSION is cached"
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force; then
              exit 0
            fi
            echo "::warning::cargo-deny install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::cargo-deny could not be installed"
          exit 1
      - name: Check dependencies
        run: cargo deny --locked check
