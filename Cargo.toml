[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.1-rc.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/Anastasimandro/Zstar"
publish = false
authors = ["The Zstar contributors"]
readme = "README.md"

# Exact pins: every version below was checked against the crates.io index.
# Licenses are listed in DEPENDENCIES.md.
[workspace.dependencies]
zstar-core = { path = "crates/core", version = "0.1.1-rc.1" }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "=0.14.3", default-features = false, features = ["zstdmt"] }
lexopt = "=0.3.2"
ctrlc = "=3.5.2"
tempfile = "=3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
