[package]
name = "zstar-cli"
description = "Command-line interface for Zstar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zstar"
path = "src/main.rs"

[features]
# Not in the default set, and release.yml does not enable it, until the owner signs off
# docs/reports/rar-provenance.md.
rar = ["zstar-core/rar"]

[dependencies]
zstar-core.workspace = true
zstar-sys.workspace = true
lexopt.workspace = true
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
