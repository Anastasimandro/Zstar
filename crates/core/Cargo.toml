[package]
name = "zstar-core"
description = "Zstar core: stream-based archive engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["zip"]
# Zip support (create + extract). ZipCrypto decryption is built in; AES is not enabled.
zip = ["dep:zip"]

[dependencies]
# Deflate through flate2 with the pure-Rust zlib-rs backend; no other codecs.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
