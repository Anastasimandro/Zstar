[package]
name = "zstar-core"
description = "Archive engine for Zstar: stream-based, no UI, no OS-specific code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["zip", "tar", "gzip", "zstd", "bzip2", "xz", "lz4", "brotli", "sevenz", "zip-bzip2", "zip-lzma", "zip-zstd", "zip-deflate64", "zip-aes", "sevenz-aes"]
zip = ["dep:zip"]
# Extra zip methods. Deflate64 and LZMA can only be read: the zip crate cannot write them.
zip-bzip2 = ["zip", "zip/bzip2"]
zip-lzma = ["zip", "zip/lzma"]
zip-zstd = ["zip", "zip/zstd"]
zip-deflate64 = ["zip", "zip/deflate64"]
zip-aes = ["zip", "zip/aes-crypto"]
tar = ["dep:tar"]
gzip = ["dep:flate2", "dep:crc32fast"]
zstd = ["dep:zstd"]
bzip2 = ["dep:bzip2"]
xz = ["dep:lzma-rust2"]
lz4 = ["dep:lz4_flex"]
brotli = ["dep:brotli"]
sevenz = ["dep:sevenz-rust2"]
sevenz-aes = ["sevenz", "sevenz-rust2/aes256"]

[dependencies]
flate2 = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
sevenz-rust2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
